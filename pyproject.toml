[project]
name = "chat-group"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hotyotio@gmail.com", email = "hotyotio@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "dotenv>=0.9.9",
    "psycopg[binary]>=3.3.8",
    "tree>=0.2.4",
]

[project.scripts]
chat-group = "chat_group:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
